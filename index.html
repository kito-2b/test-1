<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API KEY HUB</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'JetBrains Mono', monospace !important; }
        body { background: #030303; color: #f5f5f5; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem 1rem; background-image: radial-gradient(circle at 50% 20%, #1a1612 0%, #080706 50%, #030303 90%); }
        header { text-align: center; margin-bottom: 3rem; }
        h1 { font-size: 2.2rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 0.5rem; color: #f3efe6; }
        p { color: #8c857b; font-size: 0.95rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1.5rem; width: 100%; max-width: 900px; }
        .card { background: #0d0c0b; border: 1px solid #1c1a18; border-radius: 12px; padding: 1.5rem; display: flex; flex-direction: column; justify-content: space-between; transition: transform 0.2s, border-color 0.2s, background 0.2s; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .card:hover { transform: translateY(-4px); border-color: #38332e; background: #121110; }
        .product-image { width: 100%; height: 140px; background: #080807; border-radius: 8px; margin-bottom: 1.25rem; display: flex; align-items: center; justify-content: center; overflow: hidden; border: 1px solid #1c1a18; }
        .product-image img { width: 100%; height: 100%; object-fit: cover; opacity: 0.9; }
        .top-card { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1.5rem; }
        .info h3 { font-size: 1.1rem; font-weight: 600; color: #e6dfd5; }
        .stock { font-size: 0.8rem; font-weight: 700; color: #d4a373; background: rgba(212, 163, 115, 0.1); padding: 0.3rem 0.6rem; border-radius: 6px; border: 1px solid rgba(212, 163, 115, 0.2); }
        .footer-card { display: flex; align-items: center; justify-content: space-between; }
        .price { font-weight: 700; font-size: 1.1rem; color: #f3efe6; }
        button { background: #f3efe6; color: #0d0c0b; border: none; padding: 0.5rem 1rem; border-radius: 8px; font-weight: 600; font-size: 0.85rem; cursor: pointer; transition: opacity 0.2s, background 0.2s; }
        button:hover { background: #ffffff; opacity: 0.95; }
    </style>
</head>
<body>
    <header>
        <h1>API KEY HUB</h1>
        <p>Minimal design, crafted for performance.</p>
    </header>
    <div class="grid">
        <div class="card">
            <div>
                <div class="product-image">
                    <img src="https://static.vecteezy.com/system/resources/previews/082/425/430/non_2x/anthropic-logo-transparent-claude-ai-company-brand-icon-free-png.png" alt="Claude API Key">
                </div>
                <div class="top-card">
                    <div class="info">
                        <h3>Claude API Key</h3>
                    </div>
                    <span class="stock">14 left</span>
                </div>
            </div>
            <div class="footer-card">
                <span class="price">$29</span>
                <button>Buy</button>
            </div>
        </div>
        <div class="card">
            <div>
                <div class="product-image">
                    <img src="https://raw.githubusercontent.com/igorfelipeduca/claude-theme/main/icon.png" alt="Claude Pro API Key">
                </div>
                <div class="top-card">
                    <div class="info">
                        <h3>Claude Pro API Key</h3>
                    </div>
                    <span class="stock">8 left</span>
                </div>
            </div>
            <div class="footer-card">
                <span class="price">$79</span>
                <button>Buy</button>
            </div>
        </div>
        <div class="card">
            <div>
                <div class="product-image">
                    <img src="https://cdn.dribbble.com/userupload/15895749/file/original-496e77ad32075f317033850ba82b14cc.png?resize=752x&vertical=center" alt="Kilo Code API Key">
                </div>
                <div class="top-card">
                    <div class="info">
                        <h3>Kilo Code API Key</h3>
                    </div>
                    <span class="stock">25 left</span>
                </div>
            </div>
            <div class="footer-card">
                <span class="price">$19</span>
                <button>Buy</button>
            </div>
        </div>
    </div>
</body>
</html>
